name: Task 01 through 06 checks
on: [push, pull_request]
jobs:
  filesystem-and-services:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.4
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest
      - run: uv run python -c 'import fleetdoctor.agent, fleetdoctor.collector'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/aws validate
      - run: uv run python scripts/integration.py --output $RUNNER_TEMP/task06-integration-${{ github.run_id }}-${{ github.run_attempt }}.json
      - run: uv run python scripts/disk_helper_integration.py --output $RUNNER_TEMP/task04-disk-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
      - run: uv run python scripts/cpu_smoke.py --workers 2 --seconds 2 --output $RUNNER_TEMP/task05-cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
      - run: sudo "$(command -v uv)" run python scripts/oom_smoke.py --output $RUNNER_TEMP/task06-oom-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
      - run: sudo "$(command -v uv)" run python scripts/oom_helper_integration.py --output $RUNNER_TEMP/task06-oom-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task06-local-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task06-integration-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task04-disk-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task05-cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task06-oom-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task06-oom-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
