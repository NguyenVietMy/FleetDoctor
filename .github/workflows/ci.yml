name: FleetDoctor full CI validation
on: [push, pull_request]
jobs:
  filesystem-and-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLEETDOCTOR_CI_DIR: ${{ runner.temp }}/task14-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare retained CI results
        run: |
          mkdir -p "$FLEETDOCTOR_CI_DIR/root" "$FLEETDOCTOR_CI_DIR/nonroot"
          # Only the disposable output directory is writable by the container user.
          chmod 0777 "$FLEETDOCTOR_CI_DIR/nonroot"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.4
      - id: install
        run: uv sync --python /usr/bin/python3 --no-managed-python --locked --all-extras
      - name: Verify native Python process controls
        id: pidfd
        run: uv run python -c 'import os; descriptor = os.pidfd_open(os.getpid()); os.close(descriptor)'
      - id: format
        run: uv run ruff format --check .
      - id: lint
        run: uv run ruff check .
      - id: types
        run: uv run mypy src tests scripts
      - name: Prove Ticket12 fixture postmortem drafting
        id: postmortem
        run: |
          uv run pytest -q tests/test_postmortem.py --junitxml="$FLEETDOCTOR_CI_DIR/postmortem.xml"
          uv run python -m fleetdoctor.postmortem \
            --incident-id 11111111-1111-4111-8111-111111111111 \
            --scenario-record tests/fixtures/postmortem-scenario.json \
            --output-dir "$RUNNER_TEMP/task12-fixture-${{ github.run_id }}-${{ github.run_attempt }}" \
            --backend fixture \
            --fixture-response tests/fixtures/postmortem-response.json
          uv run python scripts/check_postmortem_examples.py
      - id: host_fixtures
        run: uv run pytest --junitxml="$FLEETDOCTOR_CI_DIR/linux-host.xml"
      - id: diff
        run: git diff --check
      - name: Run Linux root fixture suite
        id: container_fixtures
        run: |
          tag="fleetdoctor-task14-fixtures:${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker image rm --force "$tag" >/dev/null 2>&1 || true' EXIT
          docker build --target test --tag "$tag" .
          docker run --rm --init \
            --mount "type=bind,source=$FLEETDOCTOR_CI_DIR/root,target=/proof" "$tag" \
            /app/.venv/bin/python -m pytest -q --junitxml=/proof/linux-root.xml
          docker run --rm --init --user 10001:10001 \
            --mount "type=bind,source=$FLEETDOCTOR_CI_DIR/nonroot,target=/proof" "$tag" \
            /app/.venv/bin/python -m pytest -q --junitxml=/proof/linux-nonroot.xml
      - id: imports
        run: uv run python -c 'import fleetdoctor.agent, fleetdoctor.collector, fleetdoctor.dns, fleetdoctor.io, fleetdoctor.postmortem'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
      - id: terraform_format
        run: terraform -chdir=infra/aws fmt -check
      - id: terraform_init
        run: terraform -chdir=infra/aws init -backend=false -lockfile=readonly
      - id: terraform_validate
        run: terraform -chdir=infra/aws validate
      - id: services
        run: uv run python scripts/integration.py --output $RUNNER_TEMP/task11-integration-${{ github.run_id }}-${{ github.run_attempt }}.json
      - id: disk_native
        run: uv run python scripts/disk_helper_integration.py --output $RUNNER_TEMP/task04-disk-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
      - id: inode_native
        run: uv run python scripts/inode_helper_integration.py --output $RUNNER_TEMP/task07-inode-native-${{ github.run_id }}-${{ github.run_attempt }}.json
      - id: fd_native
        run: uv run python scripts/fd_helper_integration.py --output $RUNNER_TEMP/task08-fd-native-${{ github.run_id }}-${{ github.run_attempt }}.json
      - id: network_native
        run: uv run python scripts/network_helper_integration.py --output $RUNNER_TEMP/task09-network-native-${{ github.run_id }}-${{ github.run_attempt }}.json
      - id: dns_native
        run: uv run python scripts/dns_helper_integration.py --output $RUNNER_TEMP/task10-dns-native-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Install Ticket11 native prerequisites
        id: io_prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dmsetup e2fsprogs
          sudo modprobe dm-delay
          systemctl show-environment >/dev/null
          probe_unit="fleetdoctor-ci-systemd-${{ github.run_id }}-${{ github.run_attempt }}.service"
          sudo systemd-run --unit "$probe_unit" --wait --pipe --property=User=nobody /bin/true
          sudo systemctl stop "$probe_unit" 2>/dev/null || true
          sudo systemctl reset-failed "$probe_unit" 2>/dev/null || true
      - name: Prepare root-readable Ticket11 native runtime
        id: io_runtime
        run: |
          native_root="$(sudo mktemp -d "/opt/fleetdoctor-task11-ci-${{ github.run_id }}-${{ github.run_attempt }}.XXXXXX")"
          echo "FLEETDOCTOR_NATIVE_IO=$native_root" >> "$GITHUB_ENV"
          sudo chmod 0755 "$native_root"
          sudo git clone --no-hardlinks "$GITHUB_WORKSPACE" "$native_root/source"
          sudo git -C "$native_root/source" checkout --detach "$GITHUB_SHA"
          sudo env UV_CACHE_DIR="$native_root/cache" "$(command -v uv)" sync \
            --project "$native_root/source" --python /usr/bin/python3 \
            --no-managed-python --locked --all-extras
          sudo chmod -R a+rX "$native_root/source"
          sudo -u nobody env PYTHONDONTWRITEBYTECODE=1 \
            "$native_root/source/.venv/bin/python" -c \
            'import fleetdoctor.agent, fleetdoctor.collector, fleetdoctor.io; print("ticket11 native imports ok")'
      - name: Prove Ticket11 actual-systemd I/O lifecycle
        id: io_native
        timeout-minutes: 12
        run: |
          sudo env \
            FLEETDOCTOR_COMMON_REPO="$FLEETDOCTOR_NATIVE_IO/source" \
            PYTHONDONTWRITEBYTECODE=1 \
            "$FLEETDOCTOR_NATIVE_IO/source/.venv/bin/python" \
            "$FLEETDOCTOR_NATIVE_IO/source/scripts/io_helper_integration.py" \
            --output "$RUNNER_TEMP/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Package Ticket11 helper state
        if: always()
        run: |
          state="$RUNNER_TEMP/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.json"
          archive="$RUNNER_TEMP/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.tar.gz"
          if sudo test -f "$state"; then
            sudo tar -C "$RUNNER_TEMP" -czf "$archive" -- "$(basename "$state")"
            sudo chown "$(id -u):$(id -g)" "$state" "$archive"
            chmod 0600 "$state" "$archive"
          fi
      - name: Remove Ticket11 native runtime
        if: always()
        run: |
          if [ -n "${FLEETDOCTOR_NATIVE_IO:-}" ]; then
            native_root="$(sudo realpath -e -- "$FLEETDOCTOR_NATIVE_IO")"
            [[ "$native_root" == /opt/fleetdoctor-task11-ci-${{ github.run_id }}-${{ github.run_attempt }}.* && "$(dirname -- "$native_root")" == /opt ]]
            sudo rm -rf -- "$native_root"
          fi
      - id: cpu_smoke
        run: uv run python scripts/cpu_smoke.py --workers 2 --seconds 2 --output $RUNNER_TEMP/task05-cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Prepare accessible native OOM runtime
        id: oom_runtime
        run: |
          native_root="$(mktemp -d /tmp/fleetdoctor-oom-ci.XXXXXX)"
          echo "FLEETDOCTOR_NATIVE_CI=$native_root" >> "$GITHUB_ENV"
          chmod 755 "$native_root"
          # Clone tracked source without copying checkout credentials or shared objects.
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$native_root/worktree"
          sudo chown -R root:root "$native_root"
          sudo env UV_CACHE_DIR="$native_root/cache" "$(command -v uv)" sync \
            --project "$native_root/worktree" --python /usr/bin/python3 \
            --no-managed-python --locked --all-extras
          sudo -u nobody "$native_root/worktree/.venv/bin/python" -c 'import sys; print(sys.executable)'
          sudo -u nobody test -r "$native_root/worktree/deploy/memory_resource.py"
      - name: Prove native workload OOM
        id: oom_native
        run: |
          cd "$FLEETDOCTOR_NATIVE_CI/worktree"
          sudo .venv/bin/python scripts/oom_smoke.py --output $RUNNER_TEMP/task06-oom-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Prove native OOM helper lifecycle
        id: oom_lifecycle
        run: |
          cd "$FLEETDOCTOR_NATIVE_CI/worktree"
          sudo .venv/bin/python scripts/oom_helper_integration.py --output $RUNNER_TEMP/task06-oom-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Remove native OOM runtime
        if: always()
        run: |
          if [ -n "${FLEETDOCTOR_NATIVE_CI:-}" ]; then
            native_root="$(realpath -e -- "$FLEETDOCTOR_NATIVE_CI")"
            [[ "$native_root" == /tmp/fleetdoctor-oom-ci.* && "$(dirname -- "$native_root")" == /tmp ]]
            sudo rm -rf -- "$native_root"
          fi
      - name: Package protected network helper evidence
        if: always()
        run: |
          proof_dir="$RUNNER_TEMP/task09-network-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state"
          proof_archive="$RUNNER_TEMP/task09-network-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.tar.gz"
          if sudo test -d "$proof_dir"; then
            sudo tar -C "$proof_dir" -czf "$proof_archive" -- .
            sudo chown "$(id -u):$(id -g)" "$proof_archive"
            chmod 0600 "$proof_archive"
          fi
      - name: Enforce audited PRD coverage and retain verdict
        if: always()
        env:
          FLEETDOCTOR_CI_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 scripts/check_ci_coverage.py \
            --report "linux-host=$FLEETDOCTOR_CI_DIR/linux-host.xml" \
            --report "linux-root=$FLEETDOCTOR_CI_DIR/root/linux-root.xml" \
            --report "linux-nonroot=$FLEETDOCTOR_CI_DIR/nonroot/linux-nonroot.xml" \
            --integration "$RUNNER_TEMP/task11-integration-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --output "$FLEETDOCTOR_CI_DIR/coverage-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task14-ci-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.FLEETDOCTOR_CI_DIR }}/
            ${{ runner.temp }}/task12-fixture-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/task11-integration-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task04-disk-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task07-inode-native-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task08-fd-native-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task09-network-native-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task10-dns-native-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}-systemd.json
            ${{ runner.temp }}/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.json
            ${{ runner.temp }}/task11-io-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.tar.gz
            ${{ runner.temp }}/task09-network-native-${{ github.run_id }}-${{ github.run_attempt }}-helper-state.tar.gz
            ${{ runner.temp }}/task05-cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task06-oom-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/task06-oom-helper-${{ github.run_id }}-${{ github.run_attempt }}.json
