apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Incident PostgreSQL
    uid: incidents
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: fleetdoctor_reader
    editable: false
    jsonData:
      database: fleetdoctor
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
