name: Task 01 through 03 checks
on: [push, pull_request]
jobs:
  filesystem-and-services:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.4
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest
      - run: uv run python -c 'import fleetdoctor.agent, fleetdoctor.collector'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/aws validate
      - run: uv run python scripts/integration.py --output $RUNNER_TEMP/task03-integration.json
      - run: uv run python scripts/disk_helper_integration.py --output $RUNNER_TEMP/task03-disk-helper.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task03-local-proofs
          path: |
            ${{ runner.temp }}/task03-integration.json
            ${{ runner.temp }}/task03-disk-helper.json
